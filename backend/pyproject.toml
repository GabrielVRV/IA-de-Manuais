[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "manual-assistant"
dynamic = ["version"]
description = "API do assistente de IA para consulta de manuais técnicos de equipamentos."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.1",
    "asyncpg>=0.32",
    "alembic>=1.20",
    "pgvector>=0.5",
    "pypdfium2>=5.14",
    "python-multipart>=0.0.20",  # upload de arquivos (multipart/form-data)
    "google-genai>=2.28",
    "openai>=3.26",
    "httpx2>=2.13",  # cliente HTTP usado pelo SDK da OpenAI
    "argon2-cffi>=25.1",
    "pyjwt>=2.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "testcontainers[postgres]>=4.15",
]

[tool.hatch.version]
path = "src/manual_assistant/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/manual_assistant"]

# --------------------------------------------------------------------------- #
# Lint / format
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "C4",       # comprehensions
    "PT",       # pytest style
    "ARG",      # unused arguments
    "DTZ",      # datas sempre com fuso horário
    "S",        # bandit (security)
    "RUF",      # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",        # assert é o idioma do pytest
    "S105", "S106", # senhas falsas em testes
]
"tests/fakes.py" = ["ARG002"]  # fakes seguem a assinatura da porta, mesmo sem usar tudo
"**/migrations/versions/*" = ["N999"]  # o Alembic nomeia as migrações começando por número

# --------------------------------------------------------------------------- #
# Type checking
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*"]  # biblioteca sem anotações de tipo publicadas
ignore_missing_imports = true

# --------------------------------------------------------------------------- #
# Testes
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not live'"
markers = [
    "db: sobe um PostgreSQL real via Docker (pule com: pytest -m 'not db')",
    "live: chama a API real do provedor de IA; gasta cota (rode com: pytest -m live)",
]

[tool.coverage.run]
source = ["manual_assistant"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# Interfaces (Protocol) não têm comportamento para testar.
exclude_also = ["class .*\\bProtocol\\):"]

# --------------------------------------------------------------------------- #
# Regra de dependência da Clean Architecture (verificada no CI)
# Camadas de cima podem importar as de baixo; nunca o contrário.
# Presentation e Infrastructure são adaptadores irmãos: não se conhecem.
# --------------------------------------------------------------------------- #
[tool.importlinter]
root_package = "manual_assistant"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Clean Architecture: regra de dependência"
type = "layers"
layers = [
    "manual_assistant.main | manual_assistant.cli",
    "manual_assistant.presentation | manual_assistant.infrastructure",
    "manual_assistant.application",
    "manual_assistant.domain",
]

[[tool.importlinter.contracts]]
name = "Núcleo (domínio + aplicação) livre de frameworks"
type = "forbidden"
source_modules = ["manual_assistant.domain", "manual_assistant.application"]
forbidden_modules = ["fastapi", "starlette", "pydantic", "pydantic_settings", "uvicorn"]
