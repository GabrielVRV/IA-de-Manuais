# Configuração da CLI do Alembic, usada no desenvolvimento para criar migrações:
#   alembic revision --autogenerate -m "descricao"
# A URL do banco vem do .env (variáveis APP_DB_*), não deste arquivo.
# Em produção, as migrações rodam via: python -m manual_assistant.infrastructure.persistence.migrate

[alembic]
script_location = %(here)s/src/manual_assistant/infrastructure/persistence/migrations
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
