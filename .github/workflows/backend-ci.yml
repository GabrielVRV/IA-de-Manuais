name: Backend CI

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

defaults:
  run:
    working-directory: backend

jobs:
  quality:
    name: Lint, tipos, arquitetura e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Formatação
        run: ruff format --check .

      - name: Tipagem
        run: mypy

      - name: Regra de dependência (Clean Architecture)
        run: lint-imports

      - name: Testes
        run: pytest --cov --cov-report=term-missing

  docker:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t manual-assistant-api:ci .
