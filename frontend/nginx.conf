# Tela (arquivos estáticos do build) + proxy da API no mesmo endereço.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Acima do APP_MAX_UPLOAD_MB da API (50 por padrão): quem recusa com mensagem clara é ela.
    client_max_body_size 100m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # As respostas da IA podem demorar (tentativas automáticas em sobrecarga).
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Sempre revalidar: um novo build ou uma troca de marca chega sem limpar o cache.
    location ~ (^/$|/index\.html$|/config\.json$|/brand\.json$) {
        add_header Cache-Control "no-cache";
    }

    # Arquivos do build têm hash no nome (ex.: index-a1B2c3D4.js): cache indefinido.
    location ~ "-[A-Za-z0-9_-]{8}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
